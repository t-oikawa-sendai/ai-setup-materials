name: Sync selected student materials

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-template-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 't-oikawa-sendai/ai-setup-materials' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          repository: t-oikawa-sendai/ai-setup-materials
          ref: main
          path: source
          persist-credentials: false

      - name: Check out private distribution main
        uses: actions/checkout@v4
        with:
          repository: OSLIB21-materials/ai-setup-materials-student
          ref: main
          path: destination
          token: ${{ secrets.STUDENT_TEMPLATE_TOKEN }}

      - name: Copy only selected managed paths
        run: python3 source/scripts/sync_student_template.py source destination

      - name: Commit and push managed changes
        shell: bash
        run: |
          set -euo pipefail
          if git -C destination diff --cached --quiet; then
            echo 'No managed changes to publish.'
            exit 0
          fi
          git -C destination \
            -c user.name='t-oikawa-sendai' \
            -c user.email='244720561+t-oikawa-sendai@users.noreply.github.com' \
            commit -m 'Sync selected student materials from source main'
          git -C destination push origin HEAD:main

      - name: Read distributed main date in Japan time
        id: distribution_date
        shell: bash
        run: |
          set -euo pipefail
          git -C destination fetch --quiet origin main
          timestamp="$(git -C destination show -s --format=%cI origin/main)"
          DISTRIBUTION_TIMESTAMP="$timestamp" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          timestamp = datetime.fromisoformat(os.environ["DISTRIBUTION_TIMESTAMP"])
          if timestamp.tzinfo is None:
              raise ValueError("Distribution commit timestamp must have a timezone")
          japan = ZoneInfo("Asia/Tokyo")
          distributed_date = timestamp.astimezone(japan).date()
          if distributed_date > datetime.now(japan).date():
              raise ValueError("Distribution commit date is in the future")
          print(f"date={distributed_date}")
          PY

      - name: Notify public profile of distributed date
        env:
          PROFILE_HISTORY_DISPATCH_TOKEN: ${{ secrets.PROFILE_HISTORY_DISPATCH_TOKEN }}
          DISTRIBUTION_DATE: ${{ steps.distribution_date.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PROFILE_HISTORY_DISPATCH_TOKEN:?Missing profile dispatch token}"
          [[ "$DISTRIBUTION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $PROFILE_HISTORY_DISPATCH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --url 'https://api.github.com/repos/t-oikawa-sendai/t-oikawa-sendai/dispatches' \
            --data "{\"event_type\":\"student_materials_updated\",\"client_payload\":{\"date\":\"$DISTRIBUTION_DATE\"}}"
